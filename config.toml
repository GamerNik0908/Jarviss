# Einstellungen für Jarvis.
# Du kannst diese Datei selbst bearbeiten – oder Jarvis einfach sagen, was er ändern soll.
# Änderungen werden nach einem Neustart aktiv.
# Zugangsdaten (Tokens, Passwörter) gehören NICHT hierher – die fragt Jarvis bei Bedarf in einem Fenster ab.

[nutzer]
name = ""                 # Dein Vorname (optional)
anrede = "Sir"            # So spricht Jarvis dich an, z. B. "Sir", "Chef" oder dein Name

[gehirn]
# Modell für das Gespräch. Schneller/günstiger: "claude-haiku-5-5" oder "claude-sonnet-5-5"
modell = "claude-opus-5-5"
aufwand = "low"           # Wie gründlich Jarvis nachdenkt: low, medium, high (low = schnelle Antworten)
gespraech_fortsetzen = true   # Gespräch nach Neustarts fortsetzen
websuche = true           # Darf Jarvis im Internet nachschlagen?

[entwickler]
# Claude Code, der Jarvis' eigenen Code verändert
modell = "claude-opus-5-5"
# Kleine Aufträge (Einstellungen, kleine Fähigkeiten, Reparaturen)
aufwand = "high"
max_schritte = 150
max_minuten = 25
# Große Aufträge (neue Funktionen mit Diensten, Geräten, Konten – z. B. Telegram, 3D-Drucker)
aufwand_gross = "xhigh"
max_schritte_gross = 400
max_minuten_gross = 75
reparaturversuche = 2     # Wie oft Claude Code nach einem fehlgeschlagenen Selbsttest nachbessern darf
automatisch_neustarten = true
frage_timeout_minuten = 10   # So lange wartet Claude Code auf deine Antwort, bevor es selbst entscheidet
max_fragen = 3               # Höchstens so viele Rückfragen pro Auftrag
# false: Kann Jarvis etwas noch nicht, fragt er kurz "Soll ich mich dafür umprogrammieren?".
# true:  Bei Wünschen direkt von dir legt er ohne Rückfrage los (sag "abbrechen", wenn du es doch nicht willst).
ohne_nachfrage = false

[oberflaeche]
an = true                 # Das Jarvis-Fenster (HUD): Gespräch, Zustand, Claude Code, Projekte
fenster = "app"           # "app" (eigenes Fenster über Edge/Chrome), "browser" (normaler Tab) oder "aus" (nur mit /hud)
port = 47800              # Nur auf diesem PC erreichbar (127.0.0.1)

[projekte]
# Projekte, an denen Jarvis selbstständig arbeitet – z. B. dein Roblox-Spiel. Ein KI-Team aus Planer,
# Entwickler (Claude Code) und Prüfer arbeitet Aufgabe für Aufgabe ab; jede Aufgabe wird per Git gesichert.
ordner = ""               # Wo neue Projekte landen. Leer = <Benutzerordner>/Jarvis/Projekte
modell = "claude-opus-5-5"            # Entwickler
modell_planer = "claude-opus-5-5"     # Planer
modell_pruefer = "claude-sonnet-5-5"  # Prüfer
aufwand = "high"
max_minuten_pro_aufgabe = 45
max_schritte_pro_aufgabe = 250
pruef_runden = 2          # So oft darf der Entwickler nachbessern, wenn der Prüfer etwas findet
max_auto_aufgaben_pro_tag = 12   # Aufgaben, die sich das Team pro Tag selbst vornimmt (deine laufen immer)
pause_minuten = 2         # Pause zwischen zwei Aufgaben
bericht_uhrzeit = "08:00" # Morgenbericht (wird nachgeholt, wenn der PC später angeht)
ruhezeit = "22:00-07:30"  # Nachts arbeitet das Team leise weiter: keine Ansagen, Rückfragen entscheidet es selbst
roblox_studio = true      # Claude Code mit Roblox Studio verbinden, wenn dort der MCP-Server eingeschaltet ist

[sprechen]
engine = "edge"           # "edge" (natürliche Online-Stimme), "offline" (Systemstimme) oder "aus"
stimme = "de-DE-ConradNeural"   # Andere: de-DE-KillianNeural, de-DE-FlorianMultilingualNeural, de-DE-KatjaNeural …
tempo = "+8%"

[zuhoeren]
modus = "aktivierungswort"  # "aktivierungswort" (nur reagieren, wenn "Jarvis" gesagt wird), "immer" oder "aus"
aktivierungswoerter = ["jarvis", "jervis", "dschawis", "javis"]  # inkl. typischer Hör-Fehler
sprache = "de-DE"
nachfrage_sekunden = 10   # So lange nach einer Antwort darfst du ohne "Jarvis" weiterreden
mikrofon_index = -1       # -1 = Standardmikrofon. Liste mit /mikrofone
pause_sekunden = 0.8      # So lange Stille, bis ein Satz als beendet gilt

[ordner]
eingang = ""              # Ordner für Dateien von außen (Handy, Downloads). Leer = <Benutzerordner>/Jarvis/Eingang
